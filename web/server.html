<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Server details — RTCW / ET / Q3 Server List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="common.js"></script>
<style>
  body { background:#111;color:#ddd;font-family:monospace;padding:2rem; }
  .q3name span { white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
  .card { background:#1b1b1b;border:1px solid #333;margin-bottom:1rem; overflow:hidden; }
  .card-header { background:#222;padding:1rem; }
  .card-body { padding:1rem 1.25rem; }
  .info-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem;margin-top:1rem; }
  .info-grid div { font-size:.95rem;color:#eee; }
  .info-grid .info-label { display:block;font-size:.75rem;color:#aaa;margin-bottom:.2rem; }
  .player-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.5rem;margin-top:1rem;color:#eee;word-break:break-word; }
  .address { font-size:.9rem;color:#f58; }
  .address code { word-break: break-all; overflow-wrap: anywhere; }
  .player-count { font-weight:bold;color:#eee; }
  .status-dot { width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px; }
  .online-dot { background:#4caf50; }
  .offline-dot { background:#f44336; }
  .server-status { font-size:.85rem;color:#ccc; }
  .heartbeat-icon { color:#0dcaf0; }
  .source-badge { display:inline-block;background:#222;border:1px solid #333;border-radius:4px;padding:.1rem .5rem;font-size:.8rem;margin:.15rem .25rem .15rem 0;color:#ccc; }
  .source-badge-heartbeat { background:#0dcaf022;border-color:#0dcaf0;color:#0dcaf0; }
  .clipboard-icon { cursor:pointer;font-size:1rem;color:#ccc;transition:color .2s; }
  .clipboard-icon:hover { color:#fff; }
  .chart-label { display:block;font-size:.75rem;color:#aaa;margin-bottom:.2rem; }
  .history-chart { display:block; }
  .back-link { color:#66d9ef;text-decoration:none; }
  .back-link:hover { color:#0dcaf0;text-decoration:underline; }
  #not-found { display:none; }
</style>
</head>
<body>
  <div class="mb-3">
    <a href="index.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to server list</a>
  </div>

  <div id="not-found" class="alert alert-warning">
    Server not found. It may have gone offline and been removed, or the address is wrong.
  </div>

  <div id="server-detail" style="display:none;">
    <div class="card">
      <div class="card-header d-flex align-items-start justify-content-between flex-wrap gap-2">
        <div class="flex-grow-1">
          <div class="q3name fs-4">
            <span class="badge bg-secondary me-1" id="d-game"></span>
            <span class="badge bg-dark border border-secondary me-2" id="d-protocol-version"></span>
            <span id="d-hostname"></span>
          </div>
          <div class="address d-flex align-items-center">
            <code id="d-address" class="me-2"></code>
            <i class="bi bi-clipboard clipboard-icon" id="d-clipboard" title="Copy to clipboard"></i>
          </div>
          <div class="d-flex gap-4 mt-2">
            <div><span class="text-light-emphasis">Mod:</span> <span class="text-info" id="d-mod"></span></div>
            <div><span class="text-light-emphasis">Map:</span> <span class="text-warning" id="d-map"></span></div>
          </div>
        </div>

        <div class="text-end ms-3" style="min-width: 180px;">
          <div class="server-status mb-1">
            <span class="status-dot" id="d-dot"></span><span id="d-status-label"></span>
            <i class="bi bi-broadcast heartbeat-icon ms-1" id="d-heartbeat" title="Direct heartbeat seen recently" style="display:none;"></i>
          </div>
          <div class="player-count" id="d-player-count"></div>
          <div class="text-end" id="d-last-seen" style="font-size:.85rem;"></div>
        </div>
      </div>

      <div class="card-body">
        <div class="info-grid">
          <div><span class="info-label">Gametype</span><span id="d-gametype"></span></div>
          <div><span class="info-label">Version</span><span id="d-version"></span></div>
          <div><span class="info-label">PunkBuster</span><span id="d-pb"></span></div>
          <div><span class="info-label">Missed Polls</span><span id="d-missed-polls"></span></div>
          <div><span class="info-label">First Seen</span><span id="d-first-seen"></span></div>
          <div><span class="info-label">Learned via</span><span id="d-sources"></span></div>
          <div id="d-aka-row" style="display:none;"><span class="info-label">Also broadcasting as</span><span id="d-aka"></span></div>
        </div>

        <div class="mt-4">
          <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <span class="chart-label mb-0" id="chart-label">Player history</span>
            <div class="btn-group btn-group-sm" role="group" id="range-filter">
              <input type="radio" class="btn-check" name="range" id="range-7d" value="7d" autocomplete="off" checked>
              <label class="btn btn-outline-light" for="range-7d">7d</label>

              <input type="radio" class="btn-check" name="range" id="range-30d" value="30d" autocomplete="off">
              <label class="btn btn-outline-light" for="range-30d">30d</label>

              <input type="radio" class="btn-check" name="range" id="range-all" value="all" autocomplete="off">
              <label class="btn btn-outline-light" for="range-all">All</label>
            </div>
          </div>
          <canvas id="history-chart" class="history-chart" style="width:100%;height:220px;"></canvas>
        </div>

        <h6 class="mt-4 text-light-emphasis fw-bold">Players:</h6>
        <div class="player-grid" id="d-players"></div>

        <div id="d-bots-section" style="display:none;">
          <h6 class="mt-3 text-light-emphasis fw-bold">Bots:</h6>
          <div class="player-grid" id="d-bots"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const address = params.get('address') || '';

    function isHeartbeating(s, windowMs = 60*60*1000){
      if (!s || !s.last_heartbeat) return false;
      const d = new Date(s.last_heartbeat);
      if (isNaN(d)) return false;
      return Date.now() - d.getTime() <= windowMs;
    }

    function formatFullTime(ts){
      const d = new Date(ts);
      if (isNaN(d) || d.getFullYear() < 2000) return '—';
      return d.toLocaleString();
    }

    function renderServer(server){
      document.title = (server.hostname || server.address) + ' — RTCW / ET / Q3 Server List';

      $('#d-game').text(getGameLabel(server));
      $('#d-protocol-version').text(getVersionLabel(server));
      $('#d-hostname').html(parseNameColors(server.hostname || 'Unnamed Server'));
      $('#d-address').text(server.address);
      $('#d-clipboard').data('ip', server.address);
      $('#d-mod').text(server.mod || 'unknown');
      $('#d-map').text(server.map || 'unknown');

      $('#d-dot').removeClass('online-dot offline-dot').addClass(server.online ? 'online-dot' : 'offline-dot');
      $('#d-status-label').text(server.online ? 'Online' : 'Offline');
      $('#d-heartbeat').toggle(isHeartbeating(server));

      const hasBots = (server.bots||[]).length > 0;
      $('#d-player-count').html(
        `${server.player_count??0}/${server.max_players??0} players` +
        (hasBots ? ` <i class="bi bi-robot" title="Bots"></i> ${server.bot_count??0}` : '')
      );
      $('#d-last-seen').css('color', server.online ? '#ccc' : '#f0ad4e').text('Last seen: ' + formatFullTime(server.last_seen));

      $('#d-gametype').html(server.gametype || '<em>unknown</em>');
      $('#d-version').html(server.version || '<em>unknown</em>');
      $('#d-pb').html(server.pb || '<em>unknown</em>');
      $('#d-missed-polls').css('color', (server.missed_polls||0) > 0 ? '#f0ad4e' : 'inherit').text(server.missed_polls ?? 0);
      $('#d-first-seen').text(formatFullTime(server.first_seen));
      $('#d-sources').html(formatSources(server.sources));
      if (server.also_known_as && server.also_known_as.length) {
        $('#d-aka').html(formatAlsoKnownAs(server.also_known_as));
        $('#d-aka-row').show();
      } else {
        $('#d-aka-row').hide();
      }

      const realPlayers = (server.players||[]).map(p=>`<div class="q3name">${parseNameColors(p)}</div>`).join('');
      $('#d-players').html(realPlayers || '<em>No players online</em>');

      $('#d-bots-section').toggle(hasBots);
      if (hasBots){
        const botPlayers = (server.bots||[]).map(p=>`<div class="q3name"><i class="bi bi-robot me-1"></i>${parseNameColors(p)}</div>`).join('');
        $('#d-bots').html(botPlayers);
      }

      $('#server-detail').show();
    }

    function loadHistory(range){
      const label = {'7d':'7d', '30d':'30d', 'all':'all time'}[range] || range;
      $('#chart-label').text('Player history (' + label + ')');
      $.getJSON('/api/history?address=' + encodeURIComponent(address) + '&range=' + encodeURIComponent(range), function(points){
        const pts = (points||[]).map(p => ({ x: new Date(p.ts).getTime(), y: p.player_count }));
        drawSparkline(document.getElementById('history-chart'), pts, {color:'#0dcaf0', peakLabel:true});
      });
    }

    function loadServer(){
      $.getJSON('/api/server?address=' + encodeURIComponent(address))
        .done(renderServer)
        .fail(function(){ $('#not-found').show(); });
    }

    $('#range-filter input').on('change', function(){
      loadHistory($("input[name='range']:checked").val());
    });

    $(document).on('click', '#d-clipboard', function(){
      const icon = $(this);
      navigator.clipboard.writeText(icon.data('ip')).then(()=>{
        icon.removeClass('bi-clipboard').addClass('bi-clipboard-check');
        setTimeout(()=>icon.removeClass('bi-clipboard-check').addClass('bi-clipboard'), 900);
      });
    });

    if (!address){
      $('#not-found').text('No server address given.').show();
    } else {
      loadServer();
      loadHistory('7d');
      setInterval(loadServer, 15000);
      window.addEventListener('resize', debounce(() => loadHistory($("input[name='range']:checked").val() || '7d'), 200));
    }
  </script>
</body>
</html>
