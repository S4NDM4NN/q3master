# .gitea/workflows/docker-build-push-latest.yml
name: Build and Push Docker image to registry

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  # A new push to the same ref (e.g. another commit on an open PR) cancels
  # whatever's still running for that ref, instead of queueing behind it.
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: login to container registry
        uses: docker/login-action@v2
        with:
          registry: repo.s4ndmod.com
          username: ${{secrets.REGISTRY_USER}}
          password: ${{secrets.REGISTRY_PASSWORD}}

      # Pushed to a SEPARATE repo path (q3master-pr, not q3master) on
      # purpose: the q3master Kargo Warehouse subscribes to
      # repo.s4ndmod.com/s4ndmod/q3master with imageSelectionStrategy:
      # NewestBuild, which does not treat tagPattern as a hard filter --
      # it just promotes whatever was pushed most recently. A pr-<number>
      # tag pushed to that same path got auto-promoted into q3master-dev
      # (see ~/gitops history around 2026-08-08). Keeping PR images on
      # their own repo path makes that structurally impossible, regardless
      # of Kargo's exact tag-filtering behavior. Tag still matches
      # pr-<number> so the Argo Pull Request generator can key an
      # ephemeral preview environment off this specific PR's image (see
      # ~/gitops apps/q3master/overlays/pr).
      - name: Build & push (PR preview image, for Argo PR environments)
        if: gitea.event_name == 'pull_request'
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: repo.s4ndmod.com/s4ndmod/q3master-pr:pr-${{ gitea.event.pull_request.number }}

      # Posts (or updates, on later pushes to the same PR) a single comment
      # with the preview env URL. Uses Gitea's auto-provisioned Actions
      # token, so no extra secret to manage.
      - name: Comment PR preview URL
        if: gitea.event_name == 'pull_request'
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ gitea.event.pull_request.number }}
        run: |
          set -euo pipefail
          API="https://repo.s4ndmod.com/api/v1/repos/S4NDMoD/q3master"
          URL="https://pr-${PR_NUMBER}.q3master.dev-alpha.s4ndmod.com"
          MARKER="<!-- q3master-pr-preview-url -->"
          BODY="$(printf '%s\n\n**Preview environment:** %s\n\nSpins up automatically from this PR'\''s latest build (may take a minute after each push) and tears down when the PR closes.' "$MARKER" "$URL")"

          EXISTING_ID="$(curl -sf -H "Authorization: token ${GITEA_TOKEN}" "${API}/issues/${PR_NUMBER}/comments" \
            | jq -r --arg marker "$MARKER" '[.[] | select(.body | contains($marker))][0].id // empty')"

          PAYLOAD="$(jq -n --arg body "$BODY" '{body: $body}')"

          if [ -n "$EXISTING_ID" ]; then
            curl -sf -X PATCH -H "Authorization: token ${GITEA_TOKEN}" -H "Content-Type: application/json" \
              -d "$PAYLOAD" "${API}/issues/${PR_NUMBER}/comments/${EXISTING_ID}" >/dev/null
            echo "Updated existing preview-env comment (id ${EXISTING_ID})"
          else
            curl -sf -X POST -H "Authorization: token ${GITEA_TOKEN}" -H "Content-Type: application/json" \
              -d "$PAYLOAD" "${API}/issues/${PR_NUMBER}/comments" >/dev/null
            echo "Posted new preview-env comment"
          fi

      - name: Compute version tag
        id: version
        if: gitea.event_name == 'push'
        run: echo "tag=v$(date +%y.%m.%d)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build & push (main — latest + versioned tag)
        if: gitea.event_name == 'push'
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: |
            repo.s4ndmod.com/s4ndmod/q3master:latest
            repo.s4ndmod.com/s4ndmod/q3master:${{ steps.version.outputs.tag }}
