# .gitea/workflows/docker-build-push-latest.yml
name: Build and Push Docker image to registry

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: login to container registry
        uses: docker/login-action@v2
        with:
          registry: repo.s4ndmod.com
          username: ${{secrets.REGISTRY_USER}}
          password: ${{secrets.REGISTRY_PASSWORD}}

      - name: Compute version tag
        id: version
        run: echo "tag=v$(date +%y.%m.%d)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: |
            repo.s4ndmod.com/s4ndmod/q3master:latest
            repo.s4ndmod.com/s4ndmod/q3master:${{ steps.version.outputs.tag }}
